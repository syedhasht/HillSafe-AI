name: frontend_app
description: "HillSafe AI - Disaster Early Warning System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Premium fonts
  google_fonts: ^8.1.0
  
  # Smooth animations
  flutter_animate: ^4.5.0
  
  # Modern iconography
  lucide_icons_flutter: any
  
  # Persistent Storage
  shared_preferences: ^2.2.2
  
  # HTTP client for API calls
  http: ^1.2.0
  
  # Secure storage for tokens
  flutter_secure_storage: ^10.3.0
  
  # Date formatting
  intl: ^0.20.2
  
  # Map visualization
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  
  # Firebase - Push Notifications
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # Location Services
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  
  # Local Notifications
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

dependency_overrides:
  cli_util: ^0.5.1
  dbus: ^0.7.13
  flutter_secure_storage_windows: ^4.2.2
  image: ^4.9.0
  latlong2: ^0.10.1
  matcher: ^0.12.20
  meta: ^1.18.2
  package_info_plus: ^10.1.0
  package_info_plus_platform_interface: ^4.1.0
  test_api: ^0.7.12
  vector_math: ^2.3.0
  win32: ^6.3.0
  xml: ^7.0.1

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
